<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 173.2 200" width="173.2" height="200"
     role="img" aria-label="II — dark ground">
  <title>II — Interdisciplinary Index</title>

  <!-- Pointy-top hexagon in the sticker proportion, width √3 : height 2.
       The gate is the whole mark: its two posts are the twin I, so the letters
       and the picture are the same object rather than letters with a picture
       around them. A torii is a threshold, which is what the tool measures —
       work crossing out of the field it came from. -->
  <defs>
    <clipPath id="hex">
      <path d="M86.6 3 L170.6 51.5 L170.6 148.5 L86.6 197 L2.6 148.5 L2.6 51.5 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hex)">
    <rect width="173.2" height="200" fill="#14161A"/>

    <!-- kasagi: the overhanging lintel, cool on the left and warm on the right —
         the pair the Knowledge Flow chart uses for what a researcher cites
         against what cites them. The gate is where the two meet. -->
    <rect x="24" y="54" width="62.6" height="15" fill="#2A78D6"/>
    <rect x="86.6" y="54" width="62.6" height="15" fill="#EB6834"/>

    <!-- nuki: the tie-beam, overhanging the posts so it reads as a span -->
    <rect x="35" y="88" width="103.2" height="10" fill="#FAFAFB"/>

    <!-- the twin I: the posts -->
    <rect x="49" y="69" width="16" height="89" fill="#FAFAFB"/>
    <rect x="108.2" y="69" width="16" height="89" fill="#FAFAFB"/>
  </g>

  <path d="M86.6 3 L170.6 51.5 L170.6 148.5 L86.6 197 L2.6 148.5 L2.6 51.5 Z"
        fill="none" stroke="#FAFAFB" stroke-width="6" stroke-linejoin="round"/>
</svg>
